<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Muse Glimmer Tool-Call Accuracy and Herma Shim Routing</title>
  <desc id="chart-desc">Measured on a fixed 150-task evaluation: Muse Glimmer fine-tuned by ta-amps rises from 93.3% to 99.3% exact tool-call match, from 96.7% to 100.0% valid JSON, and from 97.3% to 99.3% refusal accuracy with a 4-bit QLoRA adapter, next to 3-tier natural-language shim routing.</desc>
  <rect width="920" height="430" rx="14" fill="#0c1017"/>
  <rect x="16" y="16" width="888" height="398" rx="11" fill="#131a24" stroke="#253244" stroke-width="1.5"/>

  <text x="40" y="54" fill="#eef2f7" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Muse Glimmer Tool Calls &amp; Herma Shim Routing</text>
  <text x="40" y="77" fill="#9fb0c5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13">Fixed 150-task Task &amp; Task Object contract evaluation -- Standard mode only (-contributor refused)</text>

  <rect x="40" y="98" width="520" height="292" rx="10" fill="#0f151e" stroke="#253244" stroke-width="1"/>
  <text x="58" y="124" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">MUSE GLIMMER, FINE-TUNED BY TA-AMPS (%)</text>

  <text x="58" y="158" fill="#eef2f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Exact tool-call match -- base model</text>
  <rect x="58" y="166" width="420" height="16" rx="4" fill="#1b2738"/>
  <rect x="58" y="166" width="391.9" height="16" rx="4" fill="#5b6f8a"/>
  <text x="488" y="179" fill="#9fb0c5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">93.3% base</text>

  <rect x="58" y="188" width="420" height="18" rx="4" fill="#1b2738"/>
  <rect x="58" y="188" width="417.1" height="18" rx="4" fill="#53d69a"/>
  <text x="488" y="202" fill="#53d69a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">99.3% QLoRA (+6.0)</text>

  <line x1="58" y1="224" x2="540" y2="224" stroke="#253244" stroke-width="1"/>

  <text x="58" y="248" fill="#eef2f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Valid JSON -- base vs QLoRA</text>
  <rect x="58" y="256" width="420" height="14" rx="4" fill="#1b2738"/>
  <rect x="58" y="256" width="406.1" height="14" rx="4" fill="#5b6f8a"/>
  <text x="488" y="267" fill="#9fb0c5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">96.7% base</text>
  <rect x="58" y="276" width="420" height="14" rx="4" fill="#1b2738"/>
  <rect x="58" y="276" width="420" height="14" rx="4" fill="#53d69a"/>
  <text x="488" y="287" fill="#53d69a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">100.0% QLoRA</text>

  <line x1="58" y1="306" x2="540" y2="306" stroke="#253244" stroke-width="1"/>

  <text x="58" y="330" fill="#eef2f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Refusal accuracy -- base vs QLoRA</text>
  <rect x="58" y="338" width="420" height="14" rx="4" fill="#1b2738"/>
  <rect x="58" y="338" width="408.7" height="14" rx="4" fill="#5b6f8a"/>
  <text x="488" y="349" fill="#9fb0c5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">97.3% base</text>
  <rect x="58" y="358" width="420" height="14" rx="4" fill="#1b2738"/>
  <rect x="58" y="358" width="417.1" height="14" rx="4" fill="#53d69a"/>
  <text x="488" y="369" fill="#53d69a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">99.3% QLoRA</text>

  <rect x="578" y="98" width="302" height="292" rx="10" fill="#0f151e" stroke="#253244" stroke-width="1"/>
  <text x="596" y="124" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">NATURAL-LANGUAGE SHIM ROUTING</text>

  <rect x="596" y="138" width="266" height="68" rx="8" fill="#131a24" stroke="#253244"/>
  <text x="608" y="158" fill="#53d69a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">respond_directly (0 LLM tokens)</text>
