app = "herma-api"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
HERMA_DB = "/data/herma.db"

[mounts]
source = "herma_data"
destination = "/data"

[http_service]
internal_port = 7730
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/api/health"
