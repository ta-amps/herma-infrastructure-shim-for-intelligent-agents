name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: herma
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: herma/package-lock.json
      - name: Install Worker dependencies
        working-directory: herma
        run: npm ci --ignore-scripts
      - name: Install
        working-directory: herma
        run: uv sync --locked --all-groups
      - name: Lint, types, tests, leak scan, index and architecture checks
        working-directory: herma
        run: make check
      - name: Three-tier trigger and Tessera provision sync demo
        working-directory: herma
        run: make demo
