[project]
name = "herma"
version = "0.1.0"
description = "Herma: context-shimming AI middleware for configurable coding harnesses — intercepts requests via keyword, semantic, or micromodel rules to respond directly or shim atomic noun, verb, and URI context from a user-configured database before LLM execution."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ta-amps" }]
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tessera[mcp]",
]

[project.scripts]
herma = "herma.cli:main"

[tool.uv.sources]
# Tessera lives in the sibling repo (github.com/ta-amps/tessera); clone both side by side.
tessera = { path = "../tessera", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herma"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT018"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["herma"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180
